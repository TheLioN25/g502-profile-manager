name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4, Libadwaita, Cairo, Libratbag)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-gi \
            python3-gi-cairo \
            xvfb

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Build Dependencies & Package
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install pycairo PyGObject

      - name: Run Test Suite (Headless via xvfb)
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Verify PEP 517 / 621 Package Build
        run: |
          python -m build --sdist --wheel
