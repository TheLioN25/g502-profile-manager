name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4, Libadwaita, Cairo, Libratbag)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pip \
            python3-build \
            python3-wheel \
            xvfb

      - name: Run Test Suite (Headless via xvfb)
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Verify PEP 517 / 621 Package Build
        run: |
          python3 -m build --sdist --wheel

      - name: Smoke Test Installed Wheel and Entry Points
        run: |
          python3 -m venv --system-site-packages /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install --no-deps dist/g502_profile_manager-*.whl
          /tmp/smoke_venv/bin/python3 -c "import cli, engine, i18n, gui.app; print('Imports in installed wheel: OK')"
          /tmp/smoke_venv/bin/g502 --help
          /tmp/smoke_venv/bin/python3 -c "
          import importlib.resources
          import services.presets, gui.icons
          p_files = [f for f in importlib.resources.files(services.presets).iterdir() if f.name.endswith('.json')]
          assert len(p_files) == 4, f'Expected 4 presets in wheel, found {len(p_files)}: {p_files}'
          i_files = [f for f in importlib.resources.files(gui.icons).iterdir() if f.is_file()]
          assert len(i_files) == 10, f'Expected 10 icons in wheel, found {len(i_files)}: {i_files}'
          print('Wheel asset assertion: OK (4 presets, 10 icons)')
          "
