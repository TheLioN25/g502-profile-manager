name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Automated Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4, Libadwaita, Cairo, Libratbag)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pip \
            xvfb

      - name: Run Test Suite (Headless via xvfb)
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Verify PEP 517 / 621 Package Build
        run: |
          python3 -m pip install build --break-system-packages 2>/dev/null || python3 -m pip install build
          python3 -m build --sdist --wheel
