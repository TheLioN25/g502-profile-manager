name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (GTK4, Libadwaita, Cairo, Libratbag)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pip \
            python3-build \
            python3-wheel \
            xvfb

      - name: Run Test Suite (Headless via xvfb)
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Verify PEP 517 / 621 Package Build
        run: |
          python3 -m build --sdist --wheel
